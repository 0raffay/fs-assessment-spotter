    <circle cx="96" cy="67" r="2.4" fill="#1e293b" stroke="none" />
    <circle cx="103" cy="67" r="2.4" fill="#1e293b" stroke="none" />
    <path d="M94 84 Q101 91 108 84" fill="none" stroke-width="3" />
    <circle cx="112" cy="86" r="3" fill="#fda4af" stroke="none" />
    <circle cx="115" cy="94" r="2.5" fill="#fde68a" stroke-width="2" />

    <!-- wheels -->
    <circle cx="26" cy="102" r="11" fill="#1e293b" />
    <circle cx="54" cy="102" r="11" fill="#1e293b" />
    <circle cx="100" cy="102" r="11" fill="#1e293b" />
    <circle cx="26" cy="102" r="4" fill="#cbd5e1" stroke="none" />
    <circle cx="54" cy="102" r="4" fill="#cbd5e1" stroke="none" />
    <circle cx="100" cy="102" r="4" fill="#cbd5e1" stroke="none" />
