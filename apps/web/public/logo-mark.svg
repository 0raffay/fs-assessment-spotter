<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SkyRig">
  <g stroke="#1e293b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- ground shadow -->
    <ellipse cx="64" cy="116" rx="56" ry="5" fill="#1e293b" opacity="0.15" stroke="none" />

    <!-- storm cloud -->
    <path d="M74 34 A9 9 0 0 1 76 16 A12 12 0 0 1 99 12 A9 9 0 0 1 114 24 A6 6 0 0 1 112 34 Z" fill="#ffffff" />
    <path d="M97 33 L89 43 L95 43 L91 51 L103 39 L97 39 L101 33 Z" fill="#facc15" stroke-width="3" />

